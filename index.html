<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proiecte UTCN CUNBM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0000 0%, #1a0505 50%, #2d0a0a 100%);
      color: #fecaca;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      text-align: center;
    }

    .top-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f87171;
      margin-bottom: 48px;
      text-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }

    .top-brand .logo {
      font-size: 2.8rem;
      margin-bottom: 0;
      animation: none;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #f87171, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
    }

    .subtitle {
      font-size: 1.1rem;
      color: #fca5a5;
      margin-bottom: 48px;
    }

    .projects {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .projects li {
      width: 100%;
      max-width: 320px;
    }

    .projects a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      background: linear-gradient(135deg, #16a34a, #10b981);
      color: white;
      text-decoration: none;
      border-radius: 24px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: bounce-soft 2s infinite ease-in-out;
    }

    .projects a:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 12px 28px rgba(22, 163, 74, 0.6);
      background: linear-gradient(135deg, #22c55e, #34d399);
    }

    .projects a .logo-icon {
      font-size: 1.8rem;
    }

    @keyframes bounce-soft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-brand">
      <span class="logo">🎓</span>
      <span>UTCN CUNBM</span>
    </div>
    <h1>Proiecte, laboratoare, tabere</h1>
    <p class="subtitle">Selectează un proiect pentru a începe</p>
    <ul class="projects">
      <li>
        <a href="funpyclub/">
          <span class="logo-icon">🐍</span>
          <span>FunPyClub</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
